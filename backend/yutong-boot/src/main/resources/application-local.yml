# local profile: 本地开发，使用 Docker Compose 依赖
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:20000}/${POSTGRES_DB:yutong}?stringtype=unspecified
    username: ${POSTGRES_USER:yutong}
    password: ${POSTGRES_PASSWORD:yutong-dev-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:20001}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

# MinIO 对象存储
yutong:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:20002}
      access-key: ${MINIO_ACCESS_KEY:yutong-minio}
      secret-key: ${MINIO_SECRET_KEY:yutong-minio-dev-secret}
      bucket: ${MINIO_BUCKET:yutong-files}
  auth:
    # 本地开发保持 Mock 模式
    mode: MOCK

logging:
  level:
    com.yutong: DEBUG
    org.springframework.web: INFO
