      doc39Section: 不进入 E1/E2 强制实现的能力 (BPMN 工作流设计器与引擎 实现见 41，实现 v1.1+)
      doc49Section: G0 与实现分期关系表 (41 工作流 v1.1~v1.5)
      status: ALIGNED
    - itemId: NOT-V02-02
      doc39Section: 不进入 E1/E2 强制实现的能力 (报表大屏设计器 设计见 42，实现 v1.5)
      doc49Section: G0 与实现分期关系表 (42 报表大屏 v1.0 基础图 v1.5 设计器)
      status: ALIGNED
    - itemId: NOT-V02-03
      doc39Section: 不进入 E1/E2 强制实现的能力 (插件市场和模板市场 设计见 45，实现 v2.0)
      doc49Section: G0 与实现分期关系表 (45 插件生态 v2.0)
      status: ALIGNED
    - itemId: NOT-V02-04
