      doc49Section: G0 与实现分期关系表 (46 多数据源 v1.5)
      status: ALIGNED
    - itemId: NOT-V02-05
      doc39Section: 不进入 E1/E2 强制实现的能力 (完整 RBAC 后台 设计见 32)
      doc49Section: G0 与实现分期关系表 (32 完整 RBAC 后台 v1.5+)
      status: ALIGNED
