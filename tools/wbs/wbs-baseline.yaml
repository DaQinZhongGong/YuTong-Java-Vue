schemaVersion: 1.0.0
artifactId: yutong-wbs-baseline
basedOn: docs/61-实现任务WBS与排期基线/61-实现任务WBS与排期基线.md
purpose: >
  Machine-readable Work Breakdown Structure (WBS) baseline aligned with 61 design document.
  Each WBS task must be schedulable, assignable, verifiable, and traceable to design docId,
  code directory, OpenAPI operationId, test case id and acceptance evidence. Coding must not
  start before WBS boundaries are confirmed. Updates must be written back to 23 tracking record.
linkedTrackingRecord: docs/23-设计到落地追踪记录/23-设计到落地追踪记录.md
linkedProductBaseline: docs/contracts/product-baseline.yaml
linkedOperationPolicies: docs/contracts/registries/operation-policies.yaml
linkedOpenApi: docs/contracts/openapi/openapi.yaml
linkedDesignFreeze: docs/39-实现基线冻结与开工准入检查/39-实现基线冻结与开工准入检查.md
linkedG0Gate: docs/49-顶尖产品对标设计完备性门禁/49-顶尖产品对标设计完备性门禁.md
releaseTaxonomyAlignment:
  source: docs/contracts/product-baseline.yaml releaseTaxonomy
  mapping:
    E1: {version: v0.2, name: Engineering foundation, wbsPrefix: P2}
    E2: {version: v0.3, name: Core vertical slice, wbsPrefix: P3}
    E3: {version: v0.4, name: Platform capability integration, wbsPrefix: P4}
    E4: {version: v0.5, name: Engineering hardening, wbsPrefix: P5}
    RC: {version: v0.9, name: Release candidate, wbsPrefix: RC}
    GA: {version: v1.0, name: Commercial general availability, wbsPrefix: GA}
versionSlices:
  - version: v0.2
    goal: P2 基础工程
    periodWeeks: 2
    wbsIds: [P2-01, P2-02, P2-03, P2-04, P2-05, P2-06, P2-07, P2-08, P2-09]
  - version: v0.3
    goal: P3 样例业务闭环
    periodWeeks: 3
    wbsIds: [P3-01, P3-02, P3-03, P3-04, P3-05, P3-06, P3-07, P3-08]
  - version: v0.4
    goal: P4 低代码 + AI 初版
    periodWeeks: 3
    wbsIds: [P4-01, P4-02, P4-03, P4-04, P4-05, P4-06, P4-07, P4-08]
  - version: v0.5
    goal: P5 工程化增强
    periodWeeks: 2
    wbsIds: [P5-01, P5-02, P5-03, P5-04, P5-05]
  - version: v1.0
    goal: C2 或 C3 商业正式版收敛与签署
    periodWeeks: 4
    wbsIds: []
    notes: 61 号文档未在 v1.0/GA 列出独立 WBS 任务，GA 收敛由 79（首版发布验收包）+ 100（产品权威基线）+ GA2-53 G0 评审报告联合覆盖，4 个 P1 问题关闭后即可启动
