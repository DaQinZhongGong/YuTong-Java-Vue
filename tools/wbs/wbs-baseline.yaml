  # v1.0 GA：无独立 WBS 任务，GA 收敛由 79/100 号文档驱动并通过 C2/C3 证据门禁
  # 61 号文档原始 WBS 仅覆盖 v0.2~v0.5 共 30 项任务，GA 不新增 WBS
  # ============================================================
governance:
  taskMustHave:
    - wbsId 唯一编号（P2-NN/P3-NN/P4-NN/P5-NN/GA-NN）
    - version 对齐 product-baseline.yaml releaseTaxonomy
    - 角色明确（后端/前端/移动端/DevOps/测试/安全/全角色）
    - 输入文档 docId 与路径
    - 输出物明确
    - 验收标准可机器化或人工可判定
    - 代码目录路径
    - OpenAPI operationId 列表（无则空数组）
    - 测试用例编号列表
    - 验收证据路径
    - 23 号追踪记录行号
    - 状态枚举 Done/Ready/InProgress/Not Started
  forbiddenTaskDescriptions:
    - '调研一下'
    - '看情况实现'
    - '待定'
    - 'TBD'
    - 'TODO 待补'
    - '稍后决定'
