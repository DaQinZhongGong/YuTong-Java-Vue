    authorityRule: '100 定义产品权威口径; contracts 是可机器消费的实现契约; 旧数字前缀仅用于路径兼容'
    conflictResolution: '发生冲突时必须按 100 的权威顺序修正低优先级来源'
  executionTemplates:
    description: '86~87 执行模板, 89 历史验收与本轮复审记录, 90 AI/团队实现总控, 91~96 端侧交付详设, 97~99 跨团队闭环详设'
