    rule: '不得把字符串主键改为数值主键'
  - id: 'FORBID-002'
    rule: '不得绕过 OpenAPI 契约直接前后端联调'
  - id: 'FORBID-003'
    rule: '不得在代码中临时发明错误码、状态机或模块边界'
  - id: 'FORBID-004'
    rule: '不得把真实密钥写入 .env.example 或文档'
  - id: 'FORBID-005'
    rule: '不得让 AI 或低代码直接写生产数据'
  - id: 'FORBID-006'
    rule: '不得未更新 23 就改变目录结构'

