# 5 步验收方法 (89 号文档 "验收方法" 章节)
acceptanceMethod:
  - step: 1
    action: '按产品、架构、数据、API、后端、Web、移动端、低代码、AI、商用、运维、安全、验收分组阅读核心设计'
  - step: 2
    action: '对跨文档强约束执行一致性扫描,包括主键类型、服务模块名、样例表名、状态枚举、技术选型、文档范围和封版结论'
  - step: 3
    action: '对发现的不一致直接修正文档,而不是只在报告中记录问题'
  - step: 4
    action: '修正后复扫旧命名、旧服务名、选型摇摆项和 ID 策略冲突'
  - step: 5
    action: '最终只给"设计实现基线成熟度"结论,不把文档验收混同为代码实现或上线验收'

# 一致性复扫 6 项检查 (89 号文档 "一致性复扫结论" 章节)
consistencyRescan:
  - check: '样例业务命名'
    expected: '通过'
    description: '未再发现 sample_apply* 旧命名'
  - check: '服务模块命名'
    expected: '通过'
    description: '03、07、09、52 对新增服务模块已保持一致'
  - check: '技术选型明确性'
    expected: '通过'
    description: '第一版核心选型已由"或"收敛为明确方案,候选项仅作为后续扩展说明'
  - check: '字符串主键策略'
    expected: '通过'
    description: 'Long id、bigint、serial 等命中均属于禁止项、检查项或反例语境'
  - check: '状态机与字典'
    expected: '通过'
    description: 'DRAFT、SUBMITTED、APPROVED、REJECTED、ARCHIVED 在业务、数据、API、UI、测试中一致'
  - check: '封版范围'
    expected: '通过'
    description: '01~85 为设计基线, 86~87 执行模板, 88 封版记录, 89 深度验收, 90 AI 实现总控, 91~96 端侧详设, 97~99 跨团队闭环'

