# YuTong Alerting Rules
# Design: 62-可观测性指标日志链路详设, 33-商用运维SLA与灾备设计
# Severity: P1 (30min response), P2 (business hours)

groups:
  - name: yutong-http
    rules:
      # P1: API 5xx error rate > 2% for 5 minutes
      - alert: HighErrorRate5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m]))
          > 0.02
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "API 5xx error rate > 2% ({{ $value | humanizePercentage }})"
          description: "5xx error rate has exceeded 2% for 5 minutes."

      # P2: P95 latency > 2s for 10 minutes
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "API P95 latency > 2s"
          description: "P95 latency has exceeded 2 seconds for 10 minutes."

  - name: yutong-business
    rules:
      # P2: AI failure rate > 10% for 10 minutes
      - alert: HighAiFailureRate
        expr: |
          sum(rate(ai_request_total{status!="SUCCESS"}[10m]))
          /
          sum(rate(ai_request_total[10m]))
          > 0.10
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "AI request failure rate > 10%"
          description: "AI request failure rate has exceeded 10% for 10 minutes."

      # P2: Lowcode generate failure
      - alert: LowcodeGenerateFailures
        expr: rate(lowcode_generate_task_total{status="FAILED"}[10m]) > 0.1
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "Lowcode generate task failures detected"
          description: "Lowcode generate tasks are failing at > 0.1/sec."

  - name: yutong-jvm
    rules:
      # P1: JVM heap usage > 85% for 5 minutes
      - alert: JvmHeapUsageHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
          and
          jvm_memory_max_bytes{area="heap"} > 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "JVM heap usage > 85% ({{ $value | humanizePercentage }})"
          description: "JVM heap memory usage has exceeded 85% for 5 minutes. Consider increasing heap size or investigating memory leaks."

      # P2: JVM heap usage > 70% for 10 minutes
      - alert: JvmHeapUsageWarning
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.70
          and
          jvm_memory_max_bytes{area="heap"} > 0
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "JVM heap usage > 70% ({{ $value | humanizePercentage }})"
          description: "JVM heap memory usage has exceeded 70% for 10 minutes. Monitor for growth trend."

      # P2: JVM thread count > 500 for 5 minutes
      - alert: JvmThreadCountHigh
        expr: jvm_threads_live_threads > 500
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "JVM live thread count > 500 ({{ $value }})"
          description: "Number of live JVM threads has exceeded 500. Possible thread leak or excessive concurrency."

  - name: yutong-datasource
    rules:
      # P1: HikariCP active connections > 90% of max for 5 minutes
      - alert: HikariPoolNearExhaustion
        expr: |
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) > 0.90
          and
          hikaricp_connections_max > 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "DB pool active > 90% ({{ $value | humanizePercentage }})"
          description: "HikariCP active connections have exceeded 90% of max pool size for 5 minutes. Risk of connection exhaustion."

      # P2: HikariCP pending threads > 0 for 5 minutes
      - alert: HikariPoolPendingThreads
        expr: hikaricp_connections_pending_threads > 0
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "DB pool has pending threads ({{ $value }})"
          description: "Threads are waiting for database connections. Consider increasing pool size or optimizing queries."

      # P2: HikariCP connection timeout rate > 0
      - alert: HikariPoolTimeoutRate
        expr: rate(hikaricp_connections_timeout_total[5m]) > 0
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "DB pool connection timeouts detected"
          description: "Connections are timing out in the pool. Check DB health and pool configuration."

  - name: yutong-infrastructure
    rules:
      # P1: Application down
      - alert: ApplicationDown
        expr: up{job="yutong-boot"} == 0
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "YuTong backend is down"
          description: "Prometheus cannot reach yutong-boot actuator endpoint."
