# YuTong Ollama 本地推理服务编排
# 设计来源: P6-02 免费 LLM 供应商集成 - 本地模型推理能力
#
# 启动: docker compose -f deploy/docker-compose.ollama.yml up -d
# 停止: docker compose -f deploy/docker-compose.ollama.yml down
# 拉取模型: docker exec -it yutong-ollama ollama pull llama3.1
#
# GA2-30: 服务名、容器名、卷名必须带 yutong- 前缀，避免与其他项目冲突。

name: yutong

services:
  yutong-ollama:
    image: ollama/ollama:latest
    container_name: yutong-ollama
    hostname: yutong-ollama
    ports:
      - "20030:11434"
    volumes:
      - yutong-ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # Windows Docker Desktop 通常无 GPU，使用 CPU 推理；生产环境可开启 GPU 加速
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # CPU 推理小模型时取消注释以限制资源，避免拖垮宿主机
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 4G

volumes:
  yutong-ollama-models:
    name: yutong-ollama-models

networks:
  default:
    name: yutong_default
    external: true
