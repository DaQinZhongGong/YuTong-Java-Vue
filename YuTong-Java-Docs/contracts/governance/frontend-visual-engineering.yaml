baseTableStateMachine:
  states: [idle, loading, success, empty, error, forbidden]
  transitions: "idle->loading->success|empty|error|forbidden"
fileUploaderStateMachine:
  states: [idle, uploading, success, error, forbidden]
  transitions: "idle->uploading->success|error"
feStoreDesign:
  stores: [auth, app, dict, lowcode, ai]
  trackApi: true
aestheticScoring:
  dimensions: [信息层级, 视觉一致性, 交互反馈, 可访问性, 美感]
  pass: 90分以上
  fail: 80分
p0CorePageGating:
  threshold: 90
  pages: [/login, /dashboard, /biz/requests]
brandKeyPages:
  pages: [/login, /dashboard, /ai/assistant]
yutongPrefixRule:
  description: yutong 前缀规则 - CSS 与 Docker 统一
  cssAliases:
    - --yutong-primary: var(--yt-color-primary)
    - --yutong-bg-page: var(--yt-bg-page)
    - --yutong-text-primary: var(--yt-text-primary)
    - --yutong-sidebar-width: 220px
  dockerImages:
    - yutong-backend-run
    - yutong-redis
    - yutong-postgres
    - yutong-minio
  network: yutong_default
